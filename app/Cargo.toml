[package]
name = "filefind"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
filefind-core = { path = "../core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
async-channel = "2"
env_logger = { version = "0.11", default-features = false }
log = "0.4"
gettext = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
