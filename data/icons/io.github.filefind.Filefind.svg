<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#7b5cff"/>
      <stop offset="0.55" stop-color="#5a3fe0"/>
      <stop offset="1" stop-color="#3a24b8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe45c"/>
      <stop offset="1" stop-color="#ffc233"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="56" cy="56" r="27"/></clipPath>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1a0b66" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <!-- Handle -->
    <path d="M78 78l20 20" stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>
    <!-- Lens -->
    <circle cx="56" cy="56" r="31" fill="#ffffff"/>
  </g>
  <circle cx="56" cy="56" r="27" fill="#f3f0ff"/>
  <!-- Text seen through the lens, with one highlighted match -->
  <g clip-path="url(#lens)">
    <rect x="30" y="40" width="44" height="6" rx="3" fill="#c9c0f2"/>
    <rect x="24" y="52" width="16" height="8" rx="4" fill="#c9c0f2"/>
    <rect x="43" y="50.5" width="34" height="11" rx="5.5" fill="url(#mark)"/>
    <rect x="28" y="66" width="36" height="6" rx="3" fill="#c9c0f2"/>
  </g>
</svg>
